name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site-only directory
        run: |
          mkdir -p "$RUNNER_TEMP/site-stage"
          cp -r index.html sw.js manifest.json logo.jpg _redirects css js icons images "$RUNNER_TEMP/site-stage/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          NPM_CONFIG_YES: true
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "$RUNNER_TEMP/site-stage" --project-name=farmultimate-solutions --branch=master --commit-dirty=true
