<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- พื้นหลัง: สี่เหลี่ยมเต็มใบ (ไม่มีมุมมน — ตามเงื่อนไข Lark) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- วงแหวนบางๆ -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="4"/>

  <!-- ลูกศรซิงก์ (สำรองข้อมูล) -->
  <g transform="translate(256 256) scale(16.5) translate(-12 -12)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
    <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </g>

  <!-- วงกลมขาวตรงกลาง + ใบไม้เขียว -->
  <circle cx="256" cy="256" r="90" fill="#ffffff"/>
  <g transform="translate(256 256) scale(6.1) translate(-12 -12)" fill="#15803d">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
  </g>

  <!-- จุดประกายเล็กๆ -->
  <circle cx="100" cy="94" r="7" fill="#ffffff" opacity=".75"/>
  <circle cx="416" cy="424" r="5" fill="#ffffff" opacity=".5"/>
</svg>
