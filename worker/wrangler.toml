name = "farmbackup"
main = "src/lark.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://farmultimate-solutions.pages.dev,http://localhost:8788,http://127.0.0.1:8788"
# Fail closed. A separate output commissioning approval is required before this
# can ever become true.
OUTPUT_CONTROL_ENABLED = "false"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "farmultimate-db"
database_id = "a317d078-9c45-433b-82f6-c49cc339c73a"
