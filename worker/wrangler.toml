name = "farmbackup"
main = "src/lark.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
# Fail closed. A separate output commissioning approval is required before this
# can ever become true.
OUTPUT_CONTROL_ENABLED = "false"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "farmultimate-db"
database_id = "a317d078-9c45-433b-82f6-c49cc339c73a"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "farmultimate-photos"
