<head>
  <meta charset="UTF-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FarmUltimate">
    <meta name="description" content="FARMULTIMATE SOLUTIONS — ระบบจัดการฟาร์มอัจฉริยะ: บันทึกแปลง/รอบปลูก/งาน/เก็บเกี่ยว, สต็อกวัสดุ, ขายพร้อมใบส่งสินค้า, สภาพอากาศรายแปลง — ใช้ได้ทั้งออนไลน์และออฟไลน์">
  <link rel="manifest" href="manifest.json">

  <script>try{var _shareToken=(new URL(location.href)).searchParams.get("share");if(!_shareToken&&!localStorage.getItem("farmult-session-v1"))document.documentElement.className+=" auth-locked";}catch(e){}</script>
  <style>
    /* ===== Auth Gate (self-contained: ไม่พึ่งไฟล์ CSS อื่น) ===== */
    html.auth-locked { background: #0b3d20 url("images/login-smart-farm.png") center/cover fixed no-repeat; min-height:100%; }
    html.auth-locked #app { visibility: hidden; }
    #authGate { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; background: #0b3d20; padding: 18px; overflow-y: auto; font-family: "Sarabun","Noto Sans Thai",system-ui,sans-serif; }
    .ag-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .ag-bg::before { content:""; position:absolute; inset:-16px; background:url("images/login-smart-farm.png") center/cover no-repeat; filter:blur(5px); transform:scale(1.03); }
    .ag-bg::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,rgba(5,28,15,.62),rgba(13,71,36,.42) 44%,rgba(0,0,0,.34)),radial-gradient(circle at 18% 16%,rgba(255,217,142,.28),transparent 34%); }
    .ag-sun { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); width: min(46vmin,340px); height: min(46vmin,340px); border-radius: 50%; background: radial-gradient(circle, rgba(255,214,120,.42) 0%, rgba(255,190,90,.24) 42%, rgba(255,180,80,0) 72%); }
    .ag-hills { position: absolute; bottom: -2px; left: 0; width: 100%; height: 44%; }
    .ag-hills .h1 { fill: rgba(255,255,255,.10); } .ag-hills .h2 { fill: rgba(16,71,39,.55); } .ag-hills .h3 { fill: rgba(9,46,24,.82); }
    .auth-box { position: relative; z-index: 1; width: min(410px, calc(100vw - 36px)); max-width: 100%; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-radius: 24px; padding: 28px 24px 22px; box-shadow: 0 30px 70px rgba(4,32,17,.5); max-height: calc(100vh - 36px); overflow-y: auto; border: 1px solid rgba(255,255,255,.6); box-sizing: border-box; }
    .auth-brand { text-align: center; margin-bottom: 16px; }
    .auth-brand img { width: 68px; height: 68px; border-radius: 16px; object-fit: cover; box-shadow: 0 8px 22px rgba(20,83,45,.35), 0 0 0 3px rgba(255,255,255,.85); }
    .auth-brand-name { font-weight: 800; font-size: 1.05rem; color: #123f23; letter-spacing: .4px; margin-top: 10px; }
    .auth-brand-sub { font-size: .78rem; color: #6b8f79; margin-top: 3px; }
    .auth-tabs { display: flex; gap: 6px; background: #eef7f0; border-radius: 12px; padding: 4px; margin-bottom: 14px; }
    .auth-tabs button { flex: 1; border: 0; background: transparent; cursor: pointer; font: inherit; font-weight: 700; font-size: .87rem; padding: 9px 0; border-radius: 9px; color: #4b6b58; }
    .auth-tabs button.active { background: linear-gradient(135deg,#16a34a,#15803d); color: #fff; box-shadow: 0 4px 12px rgba(21,128,61,.35); }
    .ag-field { margin-bottom: 10px; }
    .ag-field label { display: block; font-size: .78rem; font-weight: 700; color: #374151; margin-bottom: 4px; }
    .ag-field input { width: 100%; box-sizing: border-box; border: 1.5px solid #d7e5dc; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: .95rem; outline: none; background: #fff; color: #111; }
    .ag-field input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
    .ag-submit { width: 100%; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 1rem; color: #fff; background: linear-gradient(135deg,#16a34a,#15803d); padding: 12px 0; border-radius: 12px; margin-top: 10px; box-shadow: 0 8px 20px rgba(21,128,61,.4); }
    .ag-submit:active { transform: translateY(1px); }
    .auth-msg { min-height: 20px; font-size: .8rem; color: #dc2626; text-align: center; margin-top: 8px; font-weight: 700; }
    .auth-hint { text-align: center; font-size: .7rem; color: #93a89b; margin-top: 10px; line-height: 1.55; }
    .auth-hint a { color: #93a89b; }
    html[data-theme="dark"].auth-locked { background-color: #030906; }
    html[data-theme="dark"] #authGate { background: #030906; color: #e6efe9; }
    html[data-theme="dark"] .ag-bg::before { filter: blur(7px) brightness(.54) saturate(.92); }
    html[data-theme="dark"] .ag-bg::after { background: linear-gradient(135deg, rgba(0,0,0,.78), rgba(6,31,18,.72) 48%, rgba(0,0,0,.64)), radial-gradient(circle at 18% 16%, rgba(34,197,94,.12), transparent 34%); }
    html[data-theme="dark"] .ag-sun { opacity: .4; }
    html[data-theme="dark"] .ag-hills .h1 { fill: rgba(134,239,172,.06); } html[data-theme="dark"] .ag-hills .h2 { fill: rgba(10,48,28,.62); } html[data-theme="dark"] .ag-hills .h3 { fill: rgba(2,14,8,.9); }
    html[data-theme="dark"] .auth-box { background: rgba(13,23,18,.9); color: #e6efe9; border-color: rgba(134,239,172,.18); box-shadow: 0 30px 70px rgba(0,0,0,.68), inset 0 1px 0 rgba(255,255,255,.05); }
    html[data-theme="dark"] .auth-brand img { box-shadow: 0 8px 22px rgba(0,0,0,.45), 0 0 0 3px rgba(134,239,172,.16); }
    html[data-theme="dark"] .auth-brand-name { color: #d1fae5; }
    html[data-theme="dark"] .auth-brand-sub { color: #9ab7a6; }
    html[data-theme="dark"] .auth-tabs { background: rgba(16,36,26,.9); border: 1px solid rgba(134,239,172,.12); }
    html[data-theme="dark"] .auth-tabs button { color: #9ab7a6; }
    html[data-theme="dark"] .auth-tabs button.active { color: #fff; }
    html[data-theme="dark"] .ag-field label { color: #cde7d7; }
    html[data-theme="dark"] .ag-field input { background: rgba(3,12,8,.84); color: #f4fbf6; border-color: rgba(134,239,172,.24); }
    html[data-theme="dark"] .ag-field input::placeholder { color: #7c9788; }
    html[data-theme="dark"] .auth-hint, html[data-theme="dark"] .auth-hint a { color: #9ab7a6; }
    @media (max-width: 420px) { .auth-box { padding: 22px 16px 16px; border-radius: 20px; } .auth-brand-name { font-size: .95rem; } }
  </style>
  <script>
    function agHardReload(){
      try{ if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } }catch(e){}
      try{ if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } }catch(e){}
      setTimeout(function(){ location.replace(location.pathname + "?r=" + Date.now()); }, 300);
    }
  </script>
  <title>FARMULTIMATE SOLUTIONS — ระบบจัดการฟาร์มอัจฉริยะ</title>

  <script>try{var _ft=localStorage.getItem("farmult-theme")||"system";var _fd=_ft==="dark"||(_ft==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);if(_fd)document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>

<body>
  <!-- ====== บังคับล็อกอิน (static — ไม่พึ่ง JS ภายนอก) ====== -->
  <div id="authGate" style="display:none">
    <div class="ag-bg" aria-hidden="true">
      <div class="ag-sun"></div>
      <svg class="ag-hills" viewBox="0 0 1440 420" preserveAspectRatio="none">
        <path class="h1" d="M0,260 C240,180 420,300 720,240 C1020,180 1200,290 1440,230 L1440,420 L0,420 Z"/>
        <path class="h2" d="M0,330 C260,270 520,360 820,320 C1120,280 1280,350 1440,310 L1440,420 L0,420 Z"/>
        <path class="h3" d="M0,385 C300,350 600,400 900,375 C1150,355 1300,395 1440,370 L1440,420 L0,420 Z"/>
      </svg>
    </div>
    <div class="auth-box">
      <div class="auth-brand">
        <img src="logo.jpg" alt="" onerror="this.style.display='none'">
        <div class="auth-brand-name">FARMULTIMATE SOLUTIONS</div>
        <div class="auth-brand-sub">ระบบจัดการฟาร์มอัจฉริยะ</div>
      </div>
      <div class="auth-tabs">
        <button type="button" id="ag_tab_login" class="active">ล็อกอิน</button>
        <button type="button" id="ag_tab_reg">สมัครใหม่</button>
      </div>
      <div class="ag-field"><label>อีเมล</label><input id="g_email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="ag-field"><label>รหัสผ่าน</label><input id="g_pass" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="current-password"></div>
      <div id="g_reg_extra" style="display:none">
        <div class="ag-field"><label>ยืนยันรหัสผ่าน</label><input id="g_pass2" type="password" autocomplete="new-password"></div>
        <div class="ag-field"><label>ชื่อ-นามสกุล (ไม่บังคับ)</label><input id="g_name"></div>
      </div>
      <button type="button" class="ag-submit" id="ag_submit">ล็อกอิน</button>
      <div id="ag_msg" class="auth-msg"></div>
      <div class="auth-hint">ข้อมูลแยกต่อบัญชี ซิงก์ขึ้นคลาวด์อัตโนมัติ · ใช้แบบออฟไลน์ได้หลังล็อกอิน<br><a href="javascript:void(0)" onclick="agHardReload()">หน้าไม่ปกติ? ล้างแคชแล้วโหลดใหม่</a></div>
    </div>
  </div>
  <script>try{var _shareToken2=(new URL(location.href)).searchParams.get("share");if(!_shareToken2&&!localStorage.getItem("farmult-session-v1")){document.documentElement.className+=" auth-locked";var _ag=document.getElementById("authGate");if(_ag)_ag.style.display="flex";}}catch(e){}</script>
  <div id="app">

    <!-- ====== Top bar ====== -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <img class="brand-logo" id="brandLogo" src="logo.jpg" alt="FARMULTIMATE SOLUTIONS" onerror="this.style.display='none';document.getElementById('brandLogoFallback').style.display='inline'">
          <span class="brand-logo" id="brandLogoFallback" style="display:none">FUS</span>
          <div class="brand-text">
            <div class="brand-name"><span id="brandNameTxt">FARMULTIMATE SOLUTIONS</span> <span class="v-badge">v53</span></div>
            <div class="brand-sub" id="brandSubTxt">ระบบจัดการฟาร์มอัจฉริยะ</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="tourBtn" title="แนะนำระบบ">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          </button>
          <button class="icon-btn notif-btn" id="notifBtn" title="การแจ้งเตือน (ครบกำหนด/เลยกำหนด)">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge" id="notifBadge" hidden></span>
          </button>
          <button class="icon-btn profile-btn" id="profileBtn" title="บัญชีผู้ใช้">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <button class="icon-btn" id="editBtn" style="display:none" title="แก้ไขเว็บ (ผู้ดูแล)">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
          </button>
        </div>
      </div>
      <div class="notif-panel" id="notifPanel" hidden></div>
      <div class="profile-panel" id="profilePanel" hidden></div>
      <div class="role-switch" id="roleSwitch" role="tablist" aria-label="โหมดการใช้งาน"></div>
    </header>

    <!-- ====== Main view ====== -->
    <main id="view" class="view"></main>

    <!-- ====== Bottom navigation ====== -->
    <nav class="bottomnav" id="bottomNav"></nav>

    <!-- ====== Side-docked FAB ====== -->
    <div class="fab-dock" id="fabDock">

      </div>
      <button class="fab" id="fabBtn" aria-label="ปุ่มลัด"><span class="fab-icon">+</span></button>
    </div>

    <!-- ====== Modal & overlays ====== -->
    <div id="modalRoot"></div>
    <div id="toast" class="toast" hidden></div>
    <div id="tourOverlay" class="tour-overlay" hidden></div>

  </div>

  <!-- ลงทะเบียน Service Worker — เปิดใช้แบบออฟไลน์/ติดตั้งเป็นแอพบนมือถือ (ต้องใช้ผ่าน HTTPS หรือ localhost) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* ไม่บังคับ — ถ้าลงทะเบียนไม่ได้ก็ใช้เว็บปกติ */ });
      });
    }
  </script>
