<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>ผู้บันทึกข้อมูล | FarmUltimate</title><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/collector.css?v=20261007uxreview1"></head>
<body><header><img src="logo.jpg" alt="FarmUltimate"><div><b>FARMULTIMATE</b><small>ผู้บันทึกข้อมูล</small></div><button id="logout" hidden>ออกจากระบบ</button></header>
<main><section id="login"><h1>เข้าสู่ระบบผู้บันทึก</h1><div id="google"></div><form id="loginForm"><label>อีเมล<input name="email" type="email" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required minlength="6"></label><label id="nameField" hidden>ชื่อ<input name="name" maxlength="80"></label><button class="primary" type="submit" id="loginSubmit">เข้าสู่ระบบ</button><button type="button" id="registerToggle">สร้างบัญชีใหม่</button></form></section>
<section id="workspace" hidden><div class="toolbar"><div><span class="eyebrow">บันทึกภาคสนาม</span><h1>งานของฉัน</h1></div><button id="refresh" class="icon-button" title="โหลดสิทธิ์และรายการล่าสุด" aria-label="รีเฟรช"><i data-lucide="refresh-cw"></i></button></div><p id="identity"></p><div id="inviteBox" hidden><p>มีคำเชิญให้ร่วมบันทึกข้อมูล</p><button id="accept" class="primary">รับคำเชิญ</button></div><label class="assignment-label">ฟาร์มที่ได้รับมอบหมาย<select id="assignment"></select></label><nav class="view-tabs" aria-label="มุมมองงาน"><button data-tab="record" aria-pressed="true"><i data-lucide="clipboard-pen"></i> บันทึกข้อมูล</button><button data-tab="sent" aria-pressed="false"><i data-lucide="inbox"></i> รายการที่ฉันส่ง</button></nav><div id="content"></div></section>
<p id="message" role="status" aria-live="polite"></p></main><script src="js/lucide.min.js"></script><script src="js/private-photos.js?v=20261007uxreview1"></script><script src="js/application-rate.js?v=20261007uxreview1"></script><script src="js/collector.js?v=20261007uxreview1"></script></body></html>
